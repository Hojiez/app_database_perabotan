<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kasir Panel - Toko Perabotan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000' 
            : '';

        tailwind.config = { darkMode: 'class' }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
    <style>
        #autocompleteList { max-height: 250px; overflow-y: auto; }
        .struk-kertas { background-image: radial-gradient(circle at top, transparent 4px, white 5px); background-size: 10px 10px; background-position: top; }
        .dark .struk-kertas { background-image: radial-gradient(circle at top, transparent 4px, #1e293b 5px); background-color: #1e293b; }

       @media print {
            @page { size: 58mm auto; margin: 0mm; }
            body * { visibility: hidden; }
            #areaCetak, #areaCetak * { visibility: visible; }
            #areaCetak { position: absolute; left: 0; top: 0; width: 58mm; display: block !important; padding: 2mm; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 p-4 md:p-8 font-sans h-screen flex flex-col transition-colors duration-300">
    
    <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm mb-6 no-print">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Sistem Kasir</h1>
        <div class="flex items-center gap-4">
            <button onclick="toggleTheme()" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-full">
                <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
            </button>
            <button onclick="logout()" class="bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 px-4 py-2 rounded-lg font-bold hover:bg-red-200 transition text-sm">Logout</button>
        </div>
    </div>

    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start overflow-hidden no-print">
        <div class="lg:col-span-7 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg h-full flex flex-col">
            <h2 class="text-xl font-bold mb-4 text-gray-700 dark:text-gray-200 border-b dark:border-slate-700 pb-2">Tambah Barang</h2>
            <form id="formTambah" class="space-y-4">
                <div class="relative">
                    <label class="block font-semibold mb-1 text-gray-600 dark:text-gray-400 italic text-sm">Cari barang (Tekan "/" untuk fokus)</label>
                    <input type="text" id="searchBar" placeholder="Ketik nama perabotan..." class="w-full p-4 border-2 border-gray-200 dark:border-slate-700 rounded-lg focus:border-blue-500 dark:bg-slate-900 dark:text-white focus:outline-none transition-all" autocomplete="off">
                    <div id="autocompleteList" class="absolute z-10 w-full bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-lg shadow-2xl mt-1 hidden overflow-hidden"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold mb-1 text-gray-600 dark:text-gray-400">Harga Satuan</label>
                        <input type="text" id="tampilHarga" class="w-full p-3 bg-gray-100 dark:bg-slate-950 border border-gray-200 dark:border-slate-700 rounded-lg text-gray-500 font-bold" readonly placeholder="Rp 0">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-gray-600 dark:text-gray-400">Jumlah Manual</label>
                        <input type="number" id="jumlahBeli" min="1" value="1" class="w-full p-3 border-2 border-gray-200 dark:border-slate-700 rounded-lg focus:border-blue-500 dark:bg-slate-900 dark:text-white focus:outline-none" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold text-lg py-3 rounded-lg hover:bg-blue-700 transition mt-4 shadow-lg shadow-blue-500/30">+ Tambah ke Keranjang</button>
            </form>
        </div>

        <div class="lg:col-span-5 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg relative struk-kertas flex flex-col h-full overflow-hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-800 dark:text-white text-center border-b-2 border-dashed border-gray-200 dark:border-slate-700 pb-3">RESI PENJUALAN</h2>
            <div id="daftarKeranjang" class="flex-1 overflow-y-auto mb-4 space-y-4 pr-2"></div>
            <div class="border-t-2 border-dashed border-gray-300 dark:border-slate-700 pt-4 bg-white dark:bg-slate-800">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-lg font-bold text-gray-600 dark:text-gray-400">TOTAL:</span>
                    <span id="grandTotal" class="text-3xl font-black text-green-600 dark:text-green-400">Rp 0</span>
                </div>
                <button id="btnCheckout" class="w-full bg-green-500 text-white font-bold text-xl py-4 rounded-xl shadow-lg shadow-green-500/30 hover:bg-green-600 transition disabled:opacity-50" disabled>BAYAR SEKARANG</button>
            </div>
        </div>
    </div>

    <div id="areaCetak" class="hidden font-mono text-black bg-white mx-auto" style="width: 58mm; padding: 2mm; font-size: 11px; line-height: 1.3;">
        <div class="text-center mb-3 border-b border-black border-dashed pb-2">
            <h2 class="text-base font-bold uppercase">Bintang Furniture</h2>
            <p style="font-size: 9px;">Jl. Perabotan No. 123, Malang</p>
        </div>
        <div class="mb-2" style="font-size: 9px;">
            <p>No. Resi : <span id="p_noResi"></span></p>
            <p>Kasir    : <span id="p_namaKasir"></span></p>
        </div>
        <table class="w-full mb-2" style="font-size: 10px;">
            <thead>
                <tr class="text-left border-y border-black border-dashed">
                    <th class="py-1">Item</th>
                    <th class="py-1 text-center">Qty</th>
                    <th class="py-1 text-right">Sub</th>
                </tr>
            </thead>
            <tbody id="p_listBarang"></tbody>
        </table>
        <div class="border-t border-black border-dashed pt-2" style="font-size: 10px;">
            <div class="flex justify-between font-bold"><span>TOTAL</span><span id="p_grandTotal"></span></div>
            <div class="flex justify-between"><span>Tunai</span><span id="p_tunai"></span></div>
            <div class="flex justify-between"><span>Kembali</span><span id="p_kembali"></span></div>
        </div>
    </div>

    <script>
        if(localStorage.getItem('role') !== 'kasir') window.location.href = '/';
        function logout() { localStorage.clear(); window.location.href = '/'; }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        const swalConfig = () => ({
            background: document.documentElement.classList.contains('dark') ? '#1e293b' : '#fff',
            color: document.documentElement.classList.contains('dark') ? '#fff' : '#000'
        });

        let barangTerpilih = null, keranjang = JSON.parse(localStorage.getItem('keranjang')) || [];
        const searchInput = document.getElementById('searchBar'), autocompleteList = document.getElementById('autocompleteList'), tampilHarga = document.getElementById('tampilHarga'), jumlahInput = document.getElementById('jumlahBeli'), daftarKeranjang = document.getElementById('daftarKeranjang'), grandTotalTxt = document.getElementById('grandTotal'), btnCheckout = document.getElementById('btnCheckout');

        document.addEventListener('keydown', (e) => { if (e.key === '/') { e.preventDefault(); searchInput.focus(); } });

        let timer;
        searchInput.addEventListener('input', () => {
            clearTimeout(timer);
            if (searchInput.value.length === 0) return autocompleteList.classList.add('hidden');
            timer = setTimeout(async () => {
                const res = await fetch(`${API_BASE_URL}/api/barang?search=${searchInput.value}`);
                const barang = await res.json();
                autocompleteList.innerHTML = '';
                barang.forEach(b => {
                    if(b.stok <= 0) return;
                    const item = document.createElement('div');
                    item.className = 'p-3 hover:bg-blue-50 dark:hover:bg-slate-800 cursor-pointer border-b dark:border-slate-800 flex justify-between items-center';
                    item.innerHTML = `<div><div class="font-bold dark:text-white">${b.nama_barang}</div><div class="text-xs text-gray-400">Stok: ${b.stok}</div></div><div class="font-bold text-blue-600">Rp${b.harga.toLocaleString()}</div>`;
                    item.onclick = () => { barangTerpilih = b; tambahItem(1); searchInput.value = ''; autocompleteList.classList.add('hidden'); };
                    autocompleteList.appendChild(item);
                });
                autocompleteList.classList.remove('hidden');
            }, 300);
        });

        document.getElementById('formTambah').onsubmit = (e) => {
            e.preventDefault();
            if (!barangTerpilih) return;
            tambahItem(parseInt(jumlahInput.value));
            barangTerpilih = null; searchInput.value = ''; tampilHarga.value = ''; jumlahInput.value = '1';
        };

        function tambahItem(qty) {
            const idx = keranjang.findIndex(i => i.barang_id === barangTerpilih.barang_id);
            if(idx !== -1) { 
                keranjang[idx].jumlah += qty; 
                keranjang[idx].subtotal = keranjang[idx].jumlah * keranjang[idx].harga; 
            } else { 
                keranjang.push({ barang_id: barangTerpilih.barang_id, nama_barang: barangTerpilih.nama_barang, harga: barangTerpilih.harga, jumlah: qty, subtotal: barangTerpilih.harga * qty }); 
            }
            render();
            localStorage.setItem('keranjang', JSON.stringify(keranjang));
        }

        function render() {
            daftarKeranjang.innerHTML = ''; let total = 0;
            if (keranjang.length === 0) { 
                daftarKeranjang.innerHTML = `<p class="text-center opacity-20 py-10 italic">Keranjang Kosong</p>`; 
                btnCheckout.disabled = true; 
            } else {
                btnCheckout.disabled = false;
                keranjang.forEach((item, i) => {
                    total += item.subtotal;
                    daftarKeranjang.innerHTML += `
                        <div class="flex justify-between items-center border-b dark:border-slate-700 pb-2">
                            <div><div class="font-bold dark:text-white text-sm">${item.nama_barang}</div><div class="text-xs text-gray-400">${item.jumlah} x @${item.harga.toLocaleString()}</div></div>
                            <div class="text-right"><div class="font-bold text-blue-500 text-sm">Rp${item.subtotal.toLocaleString()}</div><button onclick="hapus(${i})" class="text-[10px] text-red-500 uppercase">Hapus</button></div>
                        </div>`;
                });
            }
            grandTotalTxt.innerText = `Rp ${total.toLocaleString()}`;
        }

        window.hapus = (i) => { keranjang.splice(i, 1); render(); localStorage.setItem('keranjang', JSON.stringify(keranjang)); };

        btnCheckout.onclick = async () => {
            let totalAngka = keranjang.reduce((sum, i) => sum + i.subtotal, 0);
            const { value: uangTunai } = await Swal.fire({
                title: 'Pembayaran',
                text: `Tagihan: Rp ${totalAngka.toLocaleString()}`,
                input: 'number',
                inputPlaceholder: 'Nominal tunai...',
                showCancelButton: true,
                ...swalConfig(),
                inputValidator: (v) => v < totalAngka ? 'Uang kurang!' : null
            });

            if (!uangTunai) return;

            btnCheckout.disabled = true;
            let berhasilCount = 0;
            for (const item of keranjang) {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/transaksi`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            id_barang: item.barang_id, 
                            jumlah: item.jumlah, 
                            total_harga: item.subtotal, 
                            username: localStorage.getItem('username') 
                        })
                    });
                    if (res.ok) berhasilCount++;
                } catch (e) { console.error(e); }
            }

            if (berhasilCount === keranjang.length) {
                const kembalian = uangTunai - totalAngka;
                siapkanStruk(uangTunai, kembalian);
                await Swal.fire({ icon: 'success', title: 'Sukses!', text: `Kembalian: Rp ${kembalian.toLocaleString()}`, ...swalConfig() });
                window.print();
                keranjang = [];
                localStorage.removeItem('keranjang');
                render();
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal!', text: 'Beberapa item gagal diproses.', ...swalConfig() });
            }
            btnCheckout.disabled = false;
        };

        function siapkanStruk(uangTunai, kembalian) {
            document.getElementById('p_noResi').innerText = `STRK-${Date.now()}`;
            document.getElementById('p_namaKasir').innerText = localStorage.getItem('username');
            const list = document.getElementById('p_listBarang');
            list.innerHTML = '';
            keranjang.forEach(item => {
                list.innerHTML += `<tr><td>${item.nama_barang}</td><td class="text-center">${item.jumlah}</td><td class="text-right">Rp${item.subtotal.toLocaleString()}</td></tr>`;
            });
            document.getElementById('p_grandTotal').innerText = grandTotalTxt.innerText;
            document.getElementById('p_tunai').innerText = `Rp ${parseInt(uangTunai).toLocaleString()}`;
            document.getElementById('p_kembali').innerText = `Rp ${kembalian.toLocaleString()}`;
        }

        render();
    </script>
</body>
</html>
